# The web front: the operations console (8080, the internal network only) and the payer edge (8081,
# the one port published to the internet). Stateless, so two replicas, one down at a time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: { app: zirnis-web }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: zirnis-web }
  template:
    metadata:
      labels: { app: zirnis-web }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: zirnis-web } } }
      containers:
        - name: web
          image: zirnis-web
          ports:
            - { name: console, containerPort: 8080 }
            - { name: edge, containerPort: 8081 }
          readinessProbe:
            tcpSocket: { port: edge }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: console }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
spec:
  maxUnavailable: 1 # node drains take one web pod at a time
  selector:
    matchLabels: { app: zirnis-web }
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: { app: zirnis-web }
  ports:
    - { name: console, port: 8080, targetPort: console }
    - { name: edge, port: 8081, targetPort: edge }
