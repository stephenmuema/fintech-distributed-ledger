name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API — build & test (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Formatting
        run: |
          unformatted=$(gofmt -l cmd internal pkg modules)
          if [ -n "$unformatted" ]; then echo "::error::gofmt needed:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go build ./...
      - name: Test (domain + integration against SQLite, race detector on)
        env:
          CGO_ENABLED: "1" # the race detector needs cgo; the shipped binary does not
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.out

  modules:
    name: Provider module — ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [kit, mpesa, kcb, equity, verto]
    defaults:
      run:
        working-directory: modules/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: modules/${{ matrix.module }}/go.mod
      - run: go vet ./...
      - run: go build ./...
      - name: Test (end to end against a real Zirnis core, through pkg/provtest)
        run: go test -count=1 ./...
      - name: Image builds
        if: matrix.module != 'kit'
        working-directory: .
        run: docker build -f modules/Dockerfile --build-arg MODULE=${{ matrix.module }} -t zirnis-${{ matrix.module }}-module:ci .

  web:
    name: Web — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
