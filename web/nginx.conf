server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  # Security headers for the SPA (the console talks only to its own origin via /api).
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  # API calls from the console are forwarded to the Go API service.
  location /api/ {
    proxy_pass http://api:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Fingerprinted build assets can be cached forever; index.html must not be.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Client-side routes (/console, /checkout/...) fall back to the SPA.
  location / {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    try_files $uri /index.html;
  }
}

# The payer edge: the only part of Zirnis published to the internet (ZIRNIS_PUBLIC_URL). It serves
# the hosted checkout page and forwards payers' and providers' calls to the API's edge listener,
# which answers nothing else. The console and the API (above) stay on the internal network.
server {
  listen 8081;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header X-Robots-Tag "noindex, nofollow" always;

  # The payer's address replaces whatever the client claimed; the API believes it only from here.
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;

  # The checkout page's calls: link details and paying.
  location /api/pay/ {
    proxy_pass http://api:8081/pay/;
  }

  # Payers returning from a provider's hosted checkout (/checkout/jenga-pgw/return).
  location ~ ^/checkout/[^/]+/return$ {
    proxy_pass http://api:8081;
  }

  # Providers' callbacks (/webhooks/mpesa/{token}/…, /webhooks/kcb/ipn).
  location /webhooks/ {
    proxy_pass http://api:8081;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /favicon.svg {}

  # The checkout page: /checkout/{code}. No other page is served here. Its form may post to a
  # provider's hosted card page (https only).
  location ~ ^/checkout/[^/]+$ {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https:" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /index.html =404;
  }

  location / {
    return 404;
  }
}
